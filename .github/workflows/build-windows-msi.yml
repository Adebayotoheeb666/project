name: Build Windows MSI Installer

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-msi:
    name: Build LSIA Windows MSI Installer
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Admin Web Dashboard Assets
        shell: cmd
        run: |
          cd admin
          call npm ci
          call npm run build

      - name: Setup WiX Toolset v3
        shell: powershell
        run: |
          $WixBin = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          if (-not (Test-Path "$WixBin\candle.exe")) {
            Write-Host "WiX v3.11 not in standard path. Downloading portable WiX binaries..." -ForegroundColor Yellow
            $WixBin = "$env:RUNNER_TEMP\wix311"
            if (-not (Test-Path "$WixBin\candle.exe")) {
              New-Item -ItemType Directory -Path $WixBin -Force | Out-Null
              curl.exe -fSL "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -o "$env:RUNNER_TEMP\wix311.zip"
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              [System.IO.Compression.ZipFile]::ExtractToDirectory("$env:RUNNER_TEMP\wix311.zip", $WixBin)
            }
          }
          Write-Host "WiX binaries located at: $WixBin" -ForegroundColor Green
          echo "$WixBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "WIXBIN=$WixBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI Installer with WiX Toolset
        shell: powershell
        run: |
          if ($env:WIXBIN) { $env:PATH = "$env:WIXBIN;$env:PATH" }
          powershell -ExecutionPolicy Bypass -File installer/wix/build-msi.ps1 -OutputDir installer_output

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsia-school-computer-windows-msi
          path: installer_output/LSIASchoolComputer.msi
          if-no-files-found: error
          retention-days: 30

      - name: Attach MSI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/LSIASchoolComputer.msi
          name: LSIA Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
